name: ci

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run python -m pipeline.check_cases
      - run: uv run python -m pipeline.check_tests

  export:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen

      - name: Export des cas (1er passage)
        run: make sync

      - name: Export des cas (2e passage, preuve d'idempotence)
        run: make sync

      - name: Vérifier l'absence de doublon
        run: test "$(ls reports/xray_mock/tests | wc -l)" -eq 35

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: export-results
          path: |
            mapping.json
            reports/xray_mock/

  test-api:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen

      - name: Installer Chromium (Playwright)
        run: uv run playwright install --with-deps chromium

      - name: Démarrer l'application
        run: make up

      - name: Suite bloquante API (tests/api + gold sans défauts)
        run: make run

      - name: Suite UI Playwright
        if: always()
        run: make run-ui

      - name: Défauts connus (non bloquant)
        if: always()
        run: make defects

      - name: Importer les résultats (FileBackend)
        if: always()
        run: make push

      - name: Rapport de synthèse
        if: always()
        run: |
          make report
          cat reports/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Logs Docker en cas d'échec
        if: failure()
        run: docker compose logs --tail=100

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-results
          path: |
            reports/
            cases/
