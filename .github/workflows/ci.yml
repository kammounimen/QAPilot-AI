name: ci

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run python -m pipeline.check_cases
      - run: uv run python -m pipeline.check_tests

  test-api:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen

      - name: Démarrer l'application
        run: make up

      - name: Suite bloquante (tests/api + gold sans défauts)
        run: make run

      - name: Défauts connus (non bloquant)
        if: always()
        run: make defects

      - name: Logs Docker en cas d'échec
        if: failure()
        run: docker compose logs --tail=100

      - name: Résumé du job
        if: always()
        run: |
          echo "## Résultats QAPilot-AI" >> "$GITHUB_STEP_SUMMARY"
          echo "- Suite bloquante : reports/junit.xml" >> "$GITHUB_STEP_SUMMARY"
          echo "- Défauts connus (DEF-001, DEF-002) : reports/junit_defects.xml" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-results
          path: |
            reports/
            cases/
